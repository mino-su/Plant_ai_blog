
services:
  db:
    image: postgres:15
    container_name: plant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: plant
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data



  redis:
    image: redis:alpine
    container_name: plant-redis
    ports:
        - "6379:6379"

  ai-flask:
    build: ./ai-flask
    container_name: plant-flask
    hostname: ai-flask
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
     - redis
    environment:
        REDIS_HOST: redis

