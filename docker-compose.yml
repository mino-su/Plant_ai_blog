services:
  db:
    image: postgres:15
    container_name: plant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: plant
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plant-net

  redis:
    image: redis:alpine
    container_name: plant-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plant-net

  ai-flask:
    image: ghcr.io/mino-su/plant_ai_blog-flask:latest
    build: ./ai-flask
    container_name: plant-flask
    restart: unless-stopped
    hostname: ai-flask
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      STORAGE_MODE: s3
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_REGION: ${AWS_S3_REGION}

    networks:
      - plant-net
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  spring-app:
    image: ghcr.io/mino-su/plant_ai_blog-backend:latest
    build: ./backend_core
    container_name: plant-spring
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-flask:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/plant
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      FLASK_AI_HOST: http://ai-flask:5000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SPRING_JWT_SECRET: ${JWT_SECRET}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_REGION: ${AWS_S3_REGION}

    networks:
      - plant-net

  frontend:
    image: ghcr.io/mino-su/plant_ai_blog-frontend:latest
    build:
      context: ./frontend-react
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: plant-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - spring-app
    networks:
      - plant-net

volumes:
  postgres-data:

networks:
  plant-net:
    driver: bridge