#      SPRING_DATASOURCE_PASSWORD: 1234
#      SPRING_DATA_REDIS_HOST: redis
#      FLASK_AI_HOST: http://ai-flask:5000

  frontend:

    build:
      context: ./frontend-react
    container_name: plant-frontend
    ports:

      - "80:5173"
    volumes:

      - ./frontend-react:/app

      - /app/node_modules
    environment:

      - CHOKIDAR_USEPOLLING=true

    command: npm run dev
