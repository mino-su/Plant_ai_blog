name: Plant Parent CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

  IMAGE_NAME: mino-su/plant_ai_blog

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 3. 백엔드(Spring) 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./backend_core
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest

      - name: 4. 프론트엔드(React+Nginx) 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-react
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest

          build-args: |
            VITE_API_URL=

      - name: 5. AI서버(Flask) 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./ai-flask
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-flask:latest

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: 6. AWS 서버 접속 및 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/plant-parent
            
          
            echo ${{ secrets.GHCR_TOKEN }} | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
          
            sudo docker compose pull
            
           
            sudo docker compose up -d --force-recreate
            
            
            sudo docker image prune -f