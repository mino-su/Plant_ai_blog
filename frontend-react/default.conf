server {
    listen 80;
    server_name treewithme.site www.treewithme.site;

    client_max_body_size 20M;


    # 1. 프론트엔드 정적 파일 서빙 (React 라우팅 지원)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2.  API 역방향 프록시 (Reverse Proxy)
    # 프론트엔드가 /api/... 로 요청하면 Nginx가 가로채서 스프링 부트 컨테이너(plant-spring:8080)로 보냄
    location /api/ {
        proxy_pass http://plant-spring:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3.  실시간 알림(SSE) 전용 설정
    # SSE는 연결이 끊기지 않아야 하므로 버퍼링을 꺼야 함
    location /api/notifications/subscribe {
        proxy_pass http://plant-spring:8080/api/notifications/subscribe;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    # 4. 이미지 파일 서빙 프록시
    # /images/... 로 들어오는 요청도 스프링 부트로 넘겨서 로컬 파일을 읽어오게 함
    location /images/ {
        proxy_pass http://plant-spring:8080/images/;
        proxy_set_header Host $host;
    }

    # 5. 인증(Auth) 역방향 프록시
    location /auth/ {

            proxy_pass http://plant-spring:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}