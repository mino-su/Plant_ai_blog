server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # 1. 프론트엔드 정적 파일 서빙
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. API 역방향 프록시 (내 PC의 인텔리제이를 바라봄)
    # host.docker.internal은 도커 컨테이너에서 내 호스트 PC를 가리키는 특수 주소입니다.
    location /api/ {
        proxy_pass http://host.docker.internal:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. 인증 관련 프록시
    location /auth/ {
        proxy_pass http://host.docker.internal:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. 실시간 알림(SSE) 전용 설정
    location /api/notifications/subscribe {
        proxy_pass http://host.docker.internal:8080/api/notifications/subscribe;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    # 5. 이미지 파일 서빙 프록시
    location /images/ {
        proxy_pass http://host.docker.internal:8080/images/;
        proxy_set_header Host $host;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}