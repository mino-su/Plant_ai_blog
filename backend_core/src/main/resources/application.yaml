spring:
  datasource:

    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/plant}  # 아래 Docker 실행 시 설정할 DB 주소
    username: ${SPRING_DATASOURCE_USERNAME:postgres}  # 아래 Docker 실행 시 설정할 ID
    password: ${SPRING_DATASOURCE_PASSWORD}  # 아래 Docker 실행 시 설정할 PW
    driver-class-name: org.postgresql.Driver

  jpa:
    # PostgreSQL 방언 설정 (스프링부트가 자동 감지하지만 명시하면 더 정확함)
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # create-drop: 껐다 켜면 데이터 다 날아감 (테스트용)
      # update: 껐다 켜도 데이터 유지됨 + 엔티티 변경사항 반영 (개발용 추천)
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  sql:
    init:
      mode: always

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  data:
    redis:
      host: localhost
      port: 6379

  flask:
    api:
      url: ${FLASK_AI_HOST}


jwt:
  secret: ${SPRING_JWT_SECRET}  # 아래 Docker 실행 시 설정할 JWT 시크릿

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.sql: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

file:
  upload-dir: ./uploads/

